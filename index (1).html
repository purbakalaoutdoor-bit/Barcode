<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pendaftaran Anggota Lengkap</title>

  <!-- Library QR Code & HTML to Canvas (untuk download gambar) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 25px; color: #1e3c72; }
    
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .panel h2 { font-size: 1.2rem; margin-bottom: 16px; color: #2a5298; border-bottom: 2px solid #f4f7f6; padding-bottom: 8px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }

    .btn { background-color: #1e3c72; color: white; border: none; padding: 10px 16px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%; }
    .btn:hover { background-color: #2a5298; }
    .btn-download { background-color: #28a745; margin-top: 15px; }
    .btn-download:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 0.8rem; width: auto; }
    .btn-danger:hover { background-color: #c82333; }

    .id-card-wrapper { display: flex; flex-direction: column; align-items: center; }
    .id-card { background-color: #ffffff; width: 100%; max-width: 320px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #e1e8ed; text-align: center; }
    .card-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #ffffff; padding: 16px; }
    .card-body { padding: 16px; }
    .user-name { font-size: 1.2rem; font-weight: 700; color: #333; }
    .user-role { font-size: 0.85rem; color: #007bff; font-weight: 600; margin-bottom: 12px; }
    .info-group { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #e1e8ed; font-size: 0.8rem; }
    .qrcode-container { background-color: #f8f9fa; padding: 16px; border-top: 1px solid #e1e8ed; display: flex; justify-content: center; align-items: center; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    table th, table td { padding: 10px; border: 1px solid #e1e8ed; text-align: left; }
    table th { background-color: #1e3c72; color: white; }
    table tr:nth-child(even) { background-color: #f9f9f9; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sistem Pendaftaran Anggota</h1>

    <div class="main-grid">
      <!-- Form Input -->
      <div class="panel">
        <h2>Formulir Pendaftaran</h2>
        <form id="registrationForm">
          <div class="form-group">
            <label for="fullName">Nama Lengkap</label>
            <input type="text" id="fullName" placeholder="Masukkan nama lengkap" required>
          </div>
          <div class="form-group">
            <label for="position">Jabatan / Peran</label>
            <select id="position" required>
              <option value="Anggota">Anggota</option>
              <option value="Pengurus">Pengurus</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
          <div class="form-group">
            <label for="department">Departemen</label>
            <input type="text" id="department" placeholder="Contoh: IT, HR, Marketing" required>
          </div>
          <button type="submit" class="btn">Daftarkan Anggota</button>
        </form>
      </div>

      <!-- Preview Kartu Identitas Digital -->
      <div class="panel">
        <h2>Kartu Identitas (Preview)</h2>
        <div class="id-card-wrapper">
          <div class="id-card" id="cardToCapture">
            <div class="card-header">
              <h3>KARTU ANGGOTA</h3>
            </div>
            <div class="card-body">
              <div class="user-name" id="cardName">Nama Anggota</div>
              <div class="user-role" id="cardPosition">Jabatan</div>
              <div class="info-group">
                <span>ID Anggota:</span>
                <strong id="cardID">ID-000000</strong>
              </div>
              <div class="info-group">
                <span>Departemen:</span>
                <strong id="cardDept">-</strong>
              </div>
            </div>
            <div class="qrcode-container">
              <div id="qrcode"></div>
            </div>
          </div>
          <button class="btn btn-download" id="downloadBtn">Unduh ID Card (PNG)</button>
        </div>
      </div>
    </div>

    <!-- Tabel Daftar Anggota -->
    <div class="panel">
      <h2>Daftar Anggota Terdaftar</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID Anggota</th>
              <th>Nama Lengkap</th>
              <th>Jabatan</th>
              <th>Departemen</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="memberTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let members = JSON.parse(localStorage.getItem("members")) || [];

    function generateID() {
      return `ID-${Math.floor(100000 + Math.random() * 900000)}`;
    }

    function updateQRCode(dataText) {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: dataText,
        width: 120,
        height: 120,
        colorDark: "#1e3c72",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function renderTable() {
      const tableBody = document.getElementById("memberTableBody");
      tableBody.innerHTML = "";
      members.forEach((member, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong>${member.id}</strong></td>
          <td>${member.name}</td>
          <td>${member.position}</td>
          <td>${member.dept}</td>
          <td><button class="btn btn-danger" onclick="deleteMember(${index})">Hapus</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    function saveToLocalStorage() {
      localStorage.setItem("members", JSON.stringify(members));
    }

    function deleteMember(index) {
      members.splice(index, 1);
      saveToLocalStorage();
      renderTable();
    }

    // Inisialisasi awal
    updateQRCode("ID-000000");
    renderTable();

    // Event handler pendaftaran
    document.getElementById("registrationForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("fullName").value.trim();
      const position = document.getElementById("position").value;
      const dept = document.getElementById("department").value.trim();
      const newID = generateID();

      // Update UI Card
      document.getElementById("cardName").innerText = name;
      document.getElementById("cardPosition").innerText = position;
      document.getElementById("cardDept").innerText = dept;
      document.getElementById("cardID").innerText = newID;

      const qrData = `ID: ${newID} | Nama: ${name} | Jabatan: ${position} | Dept: ${dept}`;
      updateQRCode(qrData);

      // Simpan data
      members.push({ id: newID, name, position, dept });
      saveToLocalStorage();
      renderTable();

      this.reset();
    });

    // Fitur Download Gambar Kartu
    document.getElementById("downloadBtn").addEventListener("click", function() {
      const card = document.getElementById("cardToCapture");
      html2canvas(card).then(canvas => {
        const link = document.createElement("a");
        link.download = `ID_Card_${document.getElementById("cardID").innerText}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });
  </script>
</body>
</html>
